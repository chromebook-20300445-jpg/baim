
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Pintar SD SMP SMA</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;min-height:100vh;background:linear-gradient(135deg,#dbeafe,#ede9fe);font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;color:#243047}
.app{background:white;width:100%;max-width:650px;padding:22px;border-radius:22px;box-shadow:0 10px 35px #0002}
header{text-align:center}
.logo{font-size:45px}
h1{color:#6941c6;margin:8px}
header p{color:#64748b;font-size:14px}
.panel{display:none}
.panel.active{display:block}
h2{line-height:1.5}
.label{font-weight:bold;margin:22px 0 10px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{background:white;border:2px solid #ddd6fe;border-radius:12px;padding:13px 4px;font-weight:bold;cursor:pointer;color:#374151}
.choice span{display:block;font-size:27px;margin-bottom:7px}
.choice.selected{background:#ede9fe;border-color:#7048e8;color:#5b21b6}
button{font-family:inherit}
.primary{width:100%;padding:15px;border:0;border-radius:12px;background:#7048e8;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:15px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.info{background:#f1f5f9;padding:13px;border-radius:10px;margin-top:15px;text-align:center;font-size:13px;color:#64748b}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{padding:8px 10px;border-radius:25px;background:#ede9fe;color:#5b21b6;font-size:12px;font-weight:bold}
.bar{height:8px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin:15px 0}
.bar div{height:100%;width:0;background:#8b5cf6}
#timerFill{background:#10b981}
.answers{display:grid;gap:10px}
.answer{background:white;border:2px solid #e5e7eb;border-radius:11px;padding:14px;text-align:left;cursor:pointer;font-size:15px;color:#243047}
.answer:hover:not(:disabled){border-color:#8b5cf6}
.answer.correct{background:#dcfce7;border-color:#22c55e}
.answer.wrong{background:#fee2e2;border-color:#ef4444}
.answer:disabled{cursor:default}
#feedback{min-height:24px;margin-top:14px;line-height:1.5;font-size:14px;font-weight:bold}
.secondary{width:100%;padding:13px;border:2px solid #e5e7eb;background:white;border-radius:11px;cursor:pointer;margin-top:10px;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0;text-align:center}
.stat{background:#f5f3ff;padding:14px 3px;border-radius:12px}
.stat strong{display:block;color:#6941c6;font-size:25px}
.stat small{font-size:12px;color:#64748b}
.review{background:#f8fafc;padding:12px;border-radius:10px;margin:10px 0;font-size:13px;line-height:1.5}
footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}
[hidden]{display:none!important}
@media(max-width:400px){.app{padding:15px}.choice{font-size:12px}h1{font-size:25px}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="logo">🎓</div>
<h1>KUIS PINTAR</h1>
<p>IPA • IPS • Matematika</p>
</header>

<section id="home" class="panel active">
<div class="label">1. Pilih tingkat pendidikan</div>
<div class="choices" id="levels">
<button type="button" class="choice" data-value="SD"><span>🎒</span>SD</button>
<button type="button" class="choice" data-value="SMP"><span>📘</span>SMP</button>
<button type="button" class="choice" data-value="SMA"><span>🎓</span>SMA</button>
</div>

<div class="label">2. Pilih mata pelajaran</div>
<div class="choices" id="subjects">
<button type="button" class="choice" data-value="IPA"><span>🔬</span>IPA</button>
<button type="button" class="choice" data-value="IPS"><span>🌍</span>IPS</button>
<button type="button" class="choice" data-value="Matematika"><span>➗</span>Matematika</button>
</div>
<div class="info" id="info">Pilih tingkat dan mata pelajaran.</div>
<button type="button" class="primary" id="start" disabled>🚀 Mulai Kuis</button>
</section>

<section id="quiz" class="panel">
<div class="top">
<span class="pill" id="levelTag">SD</span>
<span class="pill" id="subjectTag">IPA</span>
<span class="pill" id="scoreTag">0 poin</span>
<span class="pill" id="countTag">1/5</span>
</div>
<div class="bar"><div id="progressFill"></div></div>
<div class="top"><span>⏱️ Waktu</span><b id="time">30 detik</b></div>
<div class="bar"><div id="timerFill"></div></div>
<h2 id="question">Pertanyaan</h2>
<div id="answers" class="answers"></div>
<div id="feedback" aria-live="polite"></div>
<button type="button" class="primary" id="next" hidden>Soal Berikutnya ➜</button>
<button type="button" class="secondary" id="quit">🏠 Kembali ke Menu</button>
</section>

<section id="result" class="panel">
<div style="text-align:center">
<div id="resultEmoji" style="font-size:60px">🏆</div>
<h2 id="resultTitle">Kuis Selesai!</h2>
<p id="resultMessage"></p>
<div class="stats">
<div class="stat"><strong id="finalScore">0</strong><small>Nilai</small></div>
<div class="stat"><strong id="correctCount">0</strong><small>Benar</small></div>
<div class="stat"><strong id="wrongCount">0</strong><small>Salah</small></div>
</div>
<button type="button" class="primary" id="retry">🔄 Main Lagi</button>
<button type="button" class="secondary" id="homeBtn">🏠 Ganti Pilihan</button>
</div>
<h3>📝 Pembahasan Jawaban</h3>
<div id="review"></div>
</section>
<footer>KUIS PINTAR • Semangat belajar!</footer>
</main>

<script>
(function(){
"use strict";

var level="";
var subject="";
var questions=[];
var index=0;
var score=0;
var correct=0;
var wrong=0;
var seconds=30;
var timer=null;
var locked=false;
var history=[];

var $=function(id){return document.getElementById(id)};

var DB={
SD:{
IPA:[
["Organ untuk memompa darah adalah ...",["Jantung","Paru-paru","Lambung","Ginjal"],0,"Jantung memompa darah ke seluruh tubuh."],
["Bagian tumbuhan yang menyerap air adalah ...",["Daun","Akar","Bunga","Buah"],1,"Akar menyerap air dan mineral dari tanah."],
["Planet terdekat dari Matahari adalah ...",["Bumi","Mars","Merkurius","Jupiter"],2,"Merkurius adalah planet terdekat dari Matahari."],
["Air membeku pada suhu ...",["0°C","10°C","50°C","100°C"],0,"Air membeku pada 0°C dalam kondisi normal."],
["Hewan pemakan tumbuhan disebut ...",["Karnivor","Herbivor","Omnivor","Predator"],1,"Herbivor adalah hewan pemakan tumbuhan."]
],
IPS:[
["Indonesia merdeka pada tanggal ...",["17 Agustus 1945","10 November 1945","1 Juni 1945","20 Mei 1908"],0,"Proklamasi kemerdekaan dibacakan pada 17 Agustus 1945."],
["Lambang negara Indonesia adalah ...",["Harimau","Garuda Pancasila","Komodo","Elang"],1,"Lambang negara Indonesia adalah Garuda Pancasila."],
["Kegiatan menghasilkan barang disebut ...",["Konsumsi","Distribusi","Produksi","Belanja"],2,"Produksi adalah kegiatan menghasilkan barang atau jasa."],
["Nelayan biasanya bekerja di ...",["Pegunungan","Pantai","Gurun","Kutub"],1,"Nelayan mencari ikan di perairan."],
["Benua terluas di dunia adalah ...",["Afrika","Asia","Eropa","Australia"],1,"Asia merupakan benua terluas."]
],
Matematika:[
["125 + 275 = ...",["300","350","400","450"],2,"125 + 275 = 400."],
["12 × 8 = ...",["86","96","108","88"],1,"12 × 8 = 96."],
["144 ÷ 12 = ...",["10","11","12","14"],2,"144 ÷ 12 = 12."],
["Keliling persegi dengan sisi 5 cm adalah ...",["10 cm","15 cm","20 cm","25 cm"],2,"Keliling persegi = 4 × sisi = 20 cm."],
["25% dari 100 adalah ...",["20","25","30","50"],1,"25% dari 100 adalah 25."]
]},
SMP:{
IPA:[
["Organel sel tempat respirasi sel adalah ...",["Ribosom","Mitokondria","Vakuola","Kloroplas"],1,"Mitokondria merupakan tempat utama respirasi aerob."],
["Rumus kimia air adalah ...",["CO2","O2","H2O","NaCl"],2,"Air tersusun atas hidrogen dan oksigen dengan rumus H2O."],
["Satuan gaya adalah ...",["Joule","Watt","Newton","Pascal"],2,"Gaya diukur dalam newton."],
["Jika V = 12 volt dan R = 4 ohm, arus listrik adalah ...",["2 A","3 A","4 A","48 A"],1,"Hukum Ohm: I = V/R = 3 A."],
["Tumbuhan membuat makanan melalui ...",["Transpirasi","Fotosintesis","Fermentasi","Ekskresi"],1,"Fotosintesis menggunakan energi cahaya."]
],
IPS:[
["ASEAN didirikan pada tahun ...",["1945","1955","1967","1975"],2,"ASEAN didirikan pada tahun 1967."],
["Perpindahan penduduk desa ke kota disebut ...",["Urbanisasi","Imigrasi","Emigrasi","Evakuasi"],0,"Urbanisasi adalah perpindahan penduduk ke perkotaan."],
["Penyaluran barang dari produsen ke konsumen disebut ...",["Produksi","Distribusi","Konsumsi","Ekspor"],1,"Distribusi menyalurkan barang atau jasa."],
["Khatulistiwa berada pada garis lintang ...",["0°","30°","60°","90°"],0,"Garis khatulistiwa berada pada lintang nol derajat."],
["Penjualan barang ke luar negeri disebut ...",["Impor","Ekspor","Konsumsi","Produksi"],1,"Ekspor adalah penjualan barang ke luar negeri."]
],
Matematika:[
["Jika 3x + 5 = 20, nilai x adalah ...",["3","5","7","10"],1,"3x = 15, jadi x = 5."],
["Luas segitiga alas 12 cm dan tinggi 8 cm adalah ...",["48 cm²","96 cm²","40 cm²","20 cm²"],0,"Luas = 1/2 × 12 × 8 = 48 cm²."],
["(-6) × 4 = ...",["-24","-10","10","24"],0,"Bilangan negatif dikali positif hasilnya negatif."],
["Rata-rata 6, 8, 10, 12 adalah ...",["8","9","10","11"],1,"Jumlah 36 dibagi 4 = 9."],
["2a + 3a = ...",["5a","6a","5a²","a"],0,"Suku sejenis dijumlahkan menjadi 5a."]
]},
SMA:{
IPA:[
["Organel penghasil sebagian besar ATP pada respirasi aerob adalah ...",["Lisosom","Mitokondria","Badan Golgi","Sentriol"],1,"Mitokondria berperan penting dalam produksi ATP."],
["Ikatan dengan pemakaian pasangan elektron bersama disebut ...",["Ionik","Kovalen","Logam","Hidrogen"],1,"Ikatan kovalen terbentuk melalui pemakaian bersama elektron."],
["Massa 10 kg dipercepat 3 m/s². Gayanya adalah ...",["3 N","13 N","30 N","300 N"],2,"F = m × a = 10 × 3 = 30 N."],
["Larutan asam umumnya memiliki pH ...",["Di atas 7","Sama dengan 7","Di bawah 7","Selalu 14"],2,"Larutan asam memiliki pH di bawah 7."],
["Pembelahan yang menghasilkan sel haploid adalah ...",["Mitosis","Meiosis","Amitosis","Biner"],1,"Meiosis menghasilkan sel-sel haploid."]
],
IPS:[
["Inflasi merupakan ...",["Penurunan harga terus-menerus","Kenaikan harga umum berkelanjutan","Produksi nol","Ekspor nol"],1,"Inflasi adalah kenaikan tingkat harga umum secara berkelanjutan."],
["Biaya peluang berarti ...",["Seluruh biaya produksi","Nilai alternatif terbaik yang dikorbankan","Pajak","Keuntungan kotor"],1,"Biaya peluang adalah nilai pilihan terbaik yang dilepaskan."],
["Tokoh teori keunggulan komparatif adalah ...",["Adam Smith","David Ricardo","Karl Marx","John Maynard Keynes"],1,"David Ricardo menjelaskan teori keunggulan komparatif."],
["Kebijakan moneter berkaitan dengan ...",["Pengaturan uang dan kondisi moneter","Jumlah pulau","Bahasa daerah","Batas negara"],0,"Kebijakan moneter memengaruhi uang beredar dan stabilitas harga."],
["Skala peta 1:100.000 berarti 1 cm di peta sama dengan ...",["100 m","1 km","10 km","100 km"],1,"100.000 cm sama dengan 1 km."]
],
Matematika:[
["Turunan f(x) = x³ adalah ...",["x²","2x","3x²","3x³"],2,"Aturan pangkat menghasilkan 3x²."],
["sin 30° = ...",["0","1/2","√2/2","1"],1,"Nilai sin 30° adalah 1/2."],
["Akar x² - 5x + 6 = 0 adalah ...",["1 dan 6","-2 dan -3","2 dan 3","-1 dan 6"],2,"Faktornya (x - 2)(x - 3) = 0."],
["log basis 10 dari 1000 adalah ...",["2","3","10","100"],1,"Karena 10 pangkat 3 sama dengan 1000."],
["Peluang angka genap pada dadu adil adalah ...",["1/6","1/3","1/2","2/3"],2,"Ada tiga angka genap dari enam kemungkinan."]
]}
};

function show(id){
document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active")});
$(id).classList.add("active");
}
function stopTimer(){
if(timer!==null){clearInterval(timer);timer=null}
}
function shuffle(arr){
for(var i=arr.length-1;i>0;i--){
var j=Math.floor(Math.random()*(i+1));
var temp=arr[i];arr[i]=arr[j];arr[j]=temp;
}
return arr;
}

/* Perbaikan utama: simpan pilihan ke variabel yang benar,
   bukan ke window.level atau window.subject. */
function setupChoices(container,type){
$(container).querySelectorAll("button").forEach(function(btn){
btn.addEventListener("click",function(){
if(type==="level"){level=btn.dataset.value}
else{subject=btn.dataset.value}
$(container).querySelectorAll("button").forEach(function(b){
b.classList.toggle("selected",b===btn);
});
$("start").disabled=!(level && subject);
$("info").textContent=level && subject
?"Siap bermain: "+level+" • "+subject+" • 5 soal"
:"Silakan pilih tingkat dan mata pelajaran.";
});
});
}

setupChoices("levels","level");
setupChoices("subjects","subject");

function startGame(){
stopTimer();
if(!DB[level] || !DB[level][subject]){
alert("Pilih tingkat dan mata pelajaran terlebih dahulu.");
return;
}
questions=shuffle(DB[level][subject].map(function(q){
return {q:q[0],a:q[1].slice(),c:q[2],e:q[3]};
}));
index=0;score=0;correct=0;wrong=0;history=[];
$("levelTag").textContent=level;
$("subjectTag").textContent=subject;
show("quiz");
renderQuestion();
}

function renderQuestion(){
stopTimer();
locked=false;
seconds=level==="SD"?30:level==="SMP"?25:20;
var q=questions[index];
$("countTag").textContent=(index+1)+"/"+questions.length;
$("scoreTag").textContent=score+" poin";
$("progressFill").style.width=(index/questions.length*100)+"%";
$("question").textContent=q.q;
$("feedback").textContent="";
$("next").hidden=true;
$("answers").innerHTML="";
q.a.forEach(function(answer,i){
var b=document.createElement("button");
b.type="button";
b.className="answer";
b.textContent=String.fromCharCode(65+i)+". "+answer;
b.addEventListener("click",function(){chooseAnswer(i)});
$("answers").appendChild(b);
});
updateTimer();
timer=setInterval(function(){
seconds--;
updateTimer();
if(seconds<=0 && !locked){chooseAnswer(-1)}
},1000);
}

function updateTimer(){
$("time").textContent=seconds+" detik";
var total=level==="SD"?30:level==="SMP"?25:20;
$("timerFill").style.width=Math.max(0,seconds/total*100)+"%";
$("timerFill").style.background=seconds<=5?"#ef4444":"#10b981";
}

function chooseAnswer(choice){
if(locked)return;
locked=true;
stopTimer();
var q=questions[index];
var buttons=Array.from($("answers").querySelectorAll("button"));
buttons.forEach(function(b){b.disabled=true});
buttons[q.c].classList.add("correct");
var good=choice===q.c;
if(good){
correct++;
var points=(level==="SD"?10:level==="SMP"?15:20)+seconds;
score+=points;
$("feedback").textContent="✅ Benar! +"+points+" poin. "+q.e;
$("feedback").style.color="#15803d";
}else{
wrong++;
if(choice>=0)buttons[choice].classList.add("wrong");
$("feedback").textContent=(choice<0?"⏰ Waktu habis! ":"❌ Belum tepat. ")+q.e;
$("feedback").style.color="#dc2626";
}
history.push({
q:q.q,
chosen:choice<0?"Tidak menjawab":q.a[choice],
right:q.a[q.c],good:good,e:q.e
});
$("scoreTag").textContent=score+" poin";
$("progressFill").style.width=((index+1)/questions.length*100)+"%";
$("next").textContent=index===questions.length-1?"Lihat Hasil 🏆":"Soal Berikutnya ➜";
$("next").hidden=false;
}

function finishGame(){
stopTimer();
show("result");
var value=Math.round(correct/questions.length*100);
$("finalScore").textContent=value;
$("correctCount").textContent=correct;
$("wrongCount").textContent=wrong;
$("resultEmoji").textContent=value===100?"🏆":value>=80?"🌟":value>=60?"👏":"💪";
$("resultTitle").textContent=value===100?"Sempurna!":value>=80?"Hebat!":value>=60?"Bagus!":"Terus Berlatih!";
$("resultMessage").textContent="Tingkat "+level+" • "+subject+". Nilai kamu "+value+"/100. Total poin: "+score+".";
$("review").innerHTML="";
history.forEach(function(h,i){
var d=document.createElement("div");d.className="review";
var title=document.createElement("strong");
title.textContent=(i+1)+". "+(h.good?"✅ Benar":"❌ Salah");
var p=document.createElement("p");p.textContent=h.q;
var a=document.createElement("p");a.textContent="Jawaban kamu: "+h.chosen;
var r=document.createElement("p");r.textContent="Jawaban benar: "+h.right;
var e=document.createElement("p");e.textContent="💡 "+h.e;
d.appendChild(title);d.appendChild(p);d.appendChild(a);d.appendChild(r);d.appendChild(e);
$("review").appendChild(d);
});
}

$("start").addEventListener("click",startGame);
$("retry").addEventListener("click",startGame);
$("next").addEventListener("click",function(){
if(!locked)return;
index++;
if(index>=questions.length)finishGame();
else renderQuestion();
});
function goHome(){stopTimer();show("home")}
$("homeBtn").addEventListener("click",goHome);
$("quit").addEventListener("click",goHome);

})();
</script>
</body>
</html>
